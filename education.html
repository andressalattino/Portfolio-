<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title.education">Andres Salattino | Education</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="src/js/tailwind-config.js"></script>
    <link href="src/Styles.css" rel="stylesheet">
    <script type="module" src="app.js"></script>
  </head>
  <body class="bg-gray-100 flex flex-col min-h-screen font-sans dark:bg-gray-900 dark:text-white">
    <a href="#main-content" class="skip-link"><span data-i18n="skip">Skip to content</span></a>
    <header
      class="w-full bg-zinc-200 shadow-md p-4 flex items-center justify-between gap-3 dark:bg-zinc-800"
    >
      <a href="index.html" data-i18n-aria="nav.home" aria-label="Home"
        ><img src="img/logo_asd-removebg-preview.png" alt="Andres Salattino" class="h-12"></a
      >
      <div class="flex items-center gap-3 lg:gap-6">
        <nav class="hidden lg:flex gap-6 font-semibold">
          <a href="about.html" class="hover:text-blue-500 "
            ><span data-i18n="nav.about">About me</span></a
          >
          <a href="projects.html" class="hover:text-blue-500 "
            ><span data-i18n="nav.projects">Projects</span></a
          >
          <a href="contact.html" class="hover:text-blue-500 "
            ><span data-i18n="nav.contact">Contact me</span></a
          >
          <a href="education.html" aria-current="page" class="hover:text-blue-500 "
            ><span data-i18n="nav.education">Education</span></a
          >
        </nav>
        <div class="flex flex-col gap-1">
          <label for="language-select" class="text-xs"
            ><span data-i18n="language.label">Language</span></label
          >
          <select
            id="language-select"
            class="rounded-md border border-gray-400 bg-white px-2 py-1 text-sm text-gray-900 dark:bg-zinc-900 dark:text-white"
          >
            <option value="en" lang="en">English</option>
            <option value="es" lang="es">Español</option>
          </select>
        </div>
        <button
          id="theme-toggle"
          type="button"
          data-i18n-aria="theme.toggle"
          aria-label="Toggle dark mode"
          aria-pressed="false"
          class="p-2 rounded-md"
        >
          <svg width="28" height="28" aria-hidden="true">
            <use href="assets/sprites.svg#sun"></use>
          </svg>
        </button>
        <button
          id="menu-toggle"
          type="button"
          data-i18n-aria="menu.toggle"
          aria-label="Navigation menu"
          aria-controls="mobile-menu"
          aria-expanded="false"
          class="lg:hidden p-2 rounded-md"
        >
          <svg width="28" height="28" aria-hidden="true">
            <use href="assets/sprites.svg#icono-nav"></use>
          </svg>
        </button>
      </div>
    </header>
    <nav
      id="mobile-menu"
      hidden
      class="lg:hidden bg-zinc-200 dark:bg-zinc-800 text-center font-semibold p-4"
    >
      <a href="about.html" class="hover:text-blue-500 block py-2"
        ><span data-i18n="nav.about">About me</span></a
      >
      <a href="projects.html" class="hover:text-blue-500 block py-2"
        ><span data-i18n="nav.projects">Projects</span></a
      >
      <a href="contact.html" class="hover:text-blue-500 block py-2"
        ><span data-i18n="nav.contact">Contact me</span></a
      >
      <a href="education.html" aria-current="page" class="hover:text-blue-500 block py-2"
        ><span data-i18n="nav.education">Education</span></a
      >
    </nav>
    <main id="main-content" class="flex-1 flex flex-col items-center justify-center py-12 px-6">
      <h1 class="text-4xl md:text-5xl font-bold mb-6 text-blue-600 dark:text-blue-400">
        <span data-i18n="nav.education">Education</span>
      </h1>
      <p class="text-center max-w-2xl text-lg mb-10">
        <span data-i18n="education.intro"
          >2nd-year student of the University Technician in Programming program at the National
          Technological University (UTN) – Mendoza.</span
        >
      </p>
      <section class="w-full max-w-4xl mx-auto mt-10">
        <h2 class="text-2xl font-semibold text-center mb-6 text-blue-600 dark:text-blue-400">
          <span data-i18n="education.skills">My skills</span>
        </h2>
        <div class="relative overflow-hidden">
          <div id="skills-carousel" class="flex w-[200%] animate-slide">
            <div class="flex justify-around items-center w-1/2">
              <img
                src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg"
                class="w-16 h-16"
                alt="HTML"
              >
              <img
                src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/css3/css3-original.svg"
                class="w-16 h-16"
                alt="CSS"
              >
              <img
                src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg"
                class="w-16 h-16"
                alt="JavaScript"
              >
              <img
                src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/java/java-original.svg"
                class="w-16 h-16"
                alt="Java"
              >
              <img
                src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg"
                class="w-16 h-16"
                alt="Python"
              >
            </div>

            <div aria-hidden="true" class="flex justify-around items-center w-1/2">
              <img
                src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg"
                class="w-16 h-16"
                alt="HTML"
              >
              <img
                src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/css3/css3-original.svg"
                class="w-16 h-16"
                alt="CSS"
              >
              <img
                src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg"
                class="w-16 h-16"
                alt="JavaScript"
              >
              <img
                src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/java/java-original.svg"
                class="w-16 h-16"
                alt="Java"
              >
              <img
                src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg"
                class="w-16 h-16"
                alt="Python"
              >
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
