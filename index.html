<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title.index">Andres Salattino | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="src/js/tailwind-config.js"></script>
    <link href="src/Styles.css" rel="stylesheet">
    <script type="module" src="app.js"></script>
  </head>
  <body class="bg-gray-100 flex flex-col min-h-screen font-sans dark:bg-gray-900 dark:text-white">
    <a href="#main-content" class="skip-link"><span data-i18n="skip">Skip to content</span></a>
    <header
      class="w-full bg-zinc-200 shadow-md p-4 flex items-center justify-between gap-3 dark:bg-zinc-800"
    >
      <a href="index.html" data-i18n-aria="nav.home" aria-label="Home"
        ><img src="img/logo_asd-removebg-preview.png" alt="Andres Salattino" class="h-12"></a
      >
      <div class="flex items-center gap-3 lg:gap-6">
        <nav class="hidden lg:flex gap-6 font-semibold">
          <a href="about.html" class="hover:text-blue-500 "
            ><span data-i18n="nav.about">About me</span></a
          >
          <a href="projects.html" class="hover:text-blue-500 "
            ><span data-i18n="nav.projects">Projects</span></a
          >
          <a href="contact.html" class="hover:text-blue-500 "
            ><span data-i18n="nav.contact">Contact me</span></a
          >
          <a href="education.html" class="hover:text-blue-500 "
            ><span data-i18n="nav.education">Education</span></a
          >
        </nav>
        <div class="flex flex-col gap-1">
          <label for="language-select" class="text-xs"
            ><span data-i18n="language.label">Language</span></label
          >
          <select
            id="language-select"
            class="rounded-md border border-gray-400 bg-white px-2 py-1 text-sm text-gray-900 dark:bg-zinc-900 dark:text-white"
          >
            <option value="en" lang="en">English</option>
            <option value="es" lang="es">Español</option>
          </select>
        </div>
        <button
          id="theme-toggle"
          type="button"
          data-i18n-aria="theme.toggle"
          aria-label="Toggle dark mode"
          aria-pressed="false"
          class="p-2 rounded-md"
        >
          <svg width="28" height="28" aria-hidden="true">
            <use href="assets/sprites.svg#sun"></use>
          </svg>
        </button>
        <button
          id="menu-toggle"
          type="button"
          data-i18n-aria="menu.toggle"
          aria-label="Navigation menu"
          aria-controls="mobile-menu"
          aria-expanded="false"
          class="lg:hidden p-2 rounded-md"
        >
          <svg width="28" height="28" aria-hidden="true">
            <use href="assets/sprites.svg#icono-nav"></use>
          </svg>
        </button>
      </div>
    </header>
    <nav
      id="mobile-menu"
      hidden
      class="lg:hidden bg-zinc-200 dark:bg-zinc-800 text-center font-semibold p-4"
    >
      <a href="about.html" class="hover:text-blue-500 block py-2"
        ><span data-i18n="nav.about">About me</span></a
      >
      <a href="projects.html" class="hover:text-blue-500 block py-2"
        ><span data-i18n="nav.projects">Projects</span></a
      >
      <a href="contact.html" class="hover:text-blue-500 block py-2"
        ><span data-i18n="nav.contact">Contact me</span></a
      >
      <a href="education.html" class="hover:text-blue-500 block py-2"
        ><span data-i18n="nav.education">Education</span></a
      >
    </nav>
    <main
      id="main-content"
      class="flex flex-col md:flex-row items-center justify-center flex-1 gap-12 px-6 py-12"
    >
      <div class="max-w-xl text-center md:text-left">
        <h1 class="text-5xl text-blue-600 dark:text-blue-400 mb-4 font-bold">Andres Salattino</h1>
        <h2
          id="home-subtitle"
          class="text-2xl text-gray-700 dark:text-gray-300"
          data-i18n="home.subtitle"
        >
          Frontend Developer, creating responsive and easy-to-use web interfaces with attention to
          detail 🚀
        </h2>
      </div>
      <img
        src="img/avatar-pc.png"
        class="hidden md:block w-80 flex-shrink-0"
        data-i18n-alt="image.home"
        alt="Avatar sitting at a computer"
      >
    </main>
  </body>
</html>
